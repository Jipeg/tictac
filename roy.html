<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Рой — игра на выживание</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0e1020;color-scheme:dark}
html,body{height:100%;margin:0;background:#0e1020;overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var cv=document.getElementById('c'),x=cv.getContext('2d'),W,H;
function rs(){var d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
var best=0;try{best=+localStorage.getItem('rojBest')||0}catch(e){}
var R=Math.random,S,joy=null,keys={},mode='menu',lock=0,newBest=false;
var UP=[
['Урон +30%','Снаряды бьют сильнее',function(){S.dmg*=1.3}],
['Скорострельность','Стреляешь на 20% чаще',function(){S.rate*=.8}],
['Ещё снаряд','+1 снаряд в каждом залпе',function(){S.multi++}],
['Орбитальное лезвие','Вращается вокруг тебя и рубит врагов',function(){S.blades++}],
['Скорость +12%','Бегаешь быстрее',function(){S.p.spd*=1.12}],
['Магнит','Кристаллы притягиваются издалека',function(){S.magnet*=1.6}],
['Здоровье','+25 к максимуму и лечение',function(){S.p.mhp+=25;S.p.hp=Math.min(S.p.mhp,S.p.hp+40)}]];
function init(){S={t:0,kills:0,lv:1,xp:0,need:5,p:{x:0,y:0,hp:100,mhp:100,spd:150,inv:0},dmg:10,rate:.55,multi:1,magnet:70,blades:0,ang:0,cd:0,en:[],bl:[],gm:[],pt:[],sp:0,boss:60,cho:[]};mode='play';joy=null}
function spawn(boss){var a=R()*6.283,d=Math.max(W,H)/2+40,t=S.t,k=1+t/50,r=R(),e;
if(boss)e={hp:400*k,sp:55,r:30,d:20,c:'#ff4fa3',g:12};
else if(t>45&&r<.2)e={hp:90*k,sp:42,r:18,d:12,c:'#9b6bff',g:4};
else if(t>20&&r<.45)e={hp:14*k,sp:105,r:9,d:6,c:'#ffb23f',g:1};
else e={hp:22*k,sp:60,r:11,d:8,c:'#ff5a5a',g:1};
e.x=S.p.x+Math.cos(a)*d;e.y=S.p.y+Math.sin(a)*d;e.mh=e.hp;e.f=0;e.h=0;S.en.push(e)}
function burst(px,py,c,n){for(var i=0;i<n;i++){var a=R()*6.283,v=40+R()*90;S.pt.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.4+R()*.3,c:c})}}
function hit(e,d){e.hp-=d;e.f=.08;if(e.hp<=0&&!e.dead){e.dead=1;S.kills++;S.gm.push({x:e.x,y:e.y,v:e.g});burst(e.x,e.y,e.c,8)}}
function die(){mode='dead';lock=performance.now()+700;newBest=false;var t=Math.floor(S.t);if(t>best){best=t;newBest=true;try{localStorage.setItem('rojBest',best)}catch(e){}}}
function choose(){var ids=[0,1,2,3,4,5,6],c=[];while(c.length<3)c.push(ids.splice(Math.floor(R()*ids.length),1)[0]);S.cho=c;mode='lvl';joy=null}
function up(dt){
var p=S.p,vx=0,vy=0;
if(joy){vx=joy.dx;vy=joy.dy}
if(keys.ArrowLeft||keys.KeyA)vx-=1;if(keys.ArrowRight||keys.KeyD)vx+=1;if(keys.ArrowUp||keys.KeyW)vy-=1;if(keys.ArrowDown||keys.KeyS)vy+=1;
var m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}
p.x+=vx*p.spd*dt;p.y+=vy*p.spd*dt;S.t+=dt;p.inv-=dt;S.ang+=dt*3;
S.sp-=dt;if(S.sp<=0&&S.en.length<160){S.sp=Math.max(.1,.85-S.t/130);spawn(0);if(S.t>90&&R()<.4)spawn(0)}
if(S.t>=S.boss){S.boss+=60;spawn(1)}
S.cd-=dt;
if(S.cd<=0){var tg=null,bd=320*320;
S.en.forEach(function(e){var d=(e.x-p.x)*(e.x-p.x)+(e.y-p.y)*(e.y-p.y);if(d<bd){bd=d;tg=e}});
if(tg){S.cd=S.rate;var a=Math.atan2(tg.y-p.y,tg.x-p.x);for(var i=0;i<S.multi;i++){var b=a+(i-(S.multi-1)/2)*.16;S.bl.push({x:p.x,y:p.y,vx:Math.cos(b)*430,vy:Math.sin(b)*430,l:1.2})}}}
S.bl=S.bl.filter(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.l<=0)return false;
for(var i=0;i<S.en.length;i++){var e=S.en[i];if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){hit(e,S.dmg);return false}}return true});
for(var j=0;j<S.blades;j++){var a2=S.ang+j*6.283/S.blades,bx=p.x+Math.cos(a2)*55,by=p.y+Math.sin(a2)*55;
S.en.forEach(function(e){if(!e.dead&&e.h<=0&&Math.hypot(e.x-bx,e.y-by)<e.r+9){hit(e,S.dmg*.7);e.h=.35}})}
S.en.forEach(function(e){var dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt;e.f-=dt;e.h-=dt;
if(!e.dead&&d<e.r+11&&p.inv<=0){p.hp-=e.d;p.inv=.5;burst(p.x,p.y,'#ffffff',6);if(p.hp<=0)die()}});
S.en=S.en.filter(function(e){return !e.dead});
S.gm=S.gm.filter(function(g){var dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy)||1;if(d<S.magnet){g.x+=dx/d*320*dt;g.y+=dy/d*320*dt}
if(d<16){S.xp+=g.v;return false}return true});
S.pt=S.pt.filter(function(q){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;return q.l>0});
if(mode==='play'&&S.xp>=S.need){S.xp-=S.need;S.lv++;S.need=Math.round(S.need*1.35+3);choose()}
}
function tx(s,xx,yy,sz,c,al){x.font='700 '+sz+'px system-ui,-apple-system,sans-serif';x.fillStyle=c||'#fff';x.textAlign=al||'center';x.fillText(s,xx,yy)}
function tm(t){t=t|0;return ((t/60)|0)+':'+('0'+t%60).slice(-2)}
function card(i){var w=Math.min(W-40,340);return{x:(W-w)/2,y:H/2-130+i*88,w:w,h:76}}
function shade(a){x.fillStyle='rgba(8,9,20,'+a+')';x.fillRect(0,0,W,H)}
function draw(){
x.fillStyle='#0e1020';x.fillRect(0,0,W,H);
var p=S.p,ox=W/2-p.x,oy=H/2-p.y,g=64;
x.strokeStyle='#1a1e3a';x.lineWidth=1;x.beginPath();
for(var gx=((ox%g)+g)%g;gx<W;gx+=g){x.moveTo(gx,0);x.lineTo(gx,H)}
for(var gy=((oy%g)+g)%g;gy<H;gy+=g){x.moveTo(0,gy);x.lineTo(W,gy)}
x.stroke();
x.fillStyle='#4dffb0';
S.gm.forEach(function(q){var sx=q.x+ox,sy=q.y+oy,s=q.v>3?7:5;x.beginPath();x.moveTo(sx,sy-s);x.lineTo(sx+s*.8,sy);x.lineTo(sx,sy+s);x.lineTo(sx-s*.8,sy);x.fill()});
S.en.forEach(function(e){var sx=e.x+ox,sy=e.y+oy;if(sx<-40||sy<-40||sx>W+40||sy>H+40)return;
x.fillStyle=e.f>0?'#ffffff':e.c;x.beginPath();x.arc(sx,sy,e.r,0,6.283);x.fill();
if(e.mh>100){x.fillStyle='#000a';x.fillRect(sx-e.r,sy-e.r-8,e.r*2,4);x.fillStyle='#fff';x.fillRect(sx-e.r,sy-e.r-8,e.r*2*Math.max(0,e.hp/e.mh),4)}});
x.fillStyle='#ffe66b';
S.bl.forEach(function(b){x.beginPath();x.arc(b.x+ox,b.y+oy,3.5,0,6.283);x.fill()});
x.fillStyle='#7fd8ff';
for(var j=0;j<S.blades;j++){var a=S.ang+j*6.283/S.blades;x.beginPath();x.arc(W/2+Math.cos(a)*55,H/2+Math.sin(a)*55,8,0,6.283);x.fill()}
S.pt.forEach(function(q){x.globalAlpha=Math.min(1,q.l*2.5);x.fillStyle=q.c;x.fillRect(q.x+ox-2,q.y+oy-2,4,4)});
x.globalAlpha=1;
if(!(p.inv>0&&((S.t*20)|0)%2)){x.fillStyle='#38e1ff';x.shadowColor='#38e1ff';x.shadowBlur=14;x.beginPath();x.arc(W/2,H/2,11,0,6.283);x.fill();x.shadowBlur=0}
if(joy){x.strokeStyle='#ffffff40';x.lineWidth=2;x.beginPath();x.arc(joy.x,joy.y,50,0,6.283);x.stroke();x.fillStyle='#ffffff55';x.beginPath();x.arc(joy.x+joy.dx*50,joy.y+joy.dy*50,20,0,6.283);x.fill()}
x.fillStyle='#ffffff18';x.fillRect(0,0,W,8);x.fillStyle='#4dffb0';x.fillRect(0,0,W*Math.min(1,S.xp/S.need),8);
x.fillStyle='#ffffff18';x.fillRect(14,20,120,10);x.fillStyle='#ff5a7a';x.fillRect(14,20,120*Math.max(0,p.hp/p.mhp),10);
tx('Ур. '+S.lv,14,50,15,'#cfd3ff','left');tx(tm(S.t),W/2,36,22,'#fff','center');tx('Убито: '+S.kills,W-14,36,15,'#cfd3ff','right');
if(mode==='menu'){shade(.7);tx('РОЙ',W/2,H/2-70,56);
tx('Веди пальцем по экрану, чтобы двигаться.',W/2,H/2-20,16,'#cfd3ff');
tx('Огонь ведётся сам. Собирай кристаллы,',W/2,H/2+8,16,'#cfd3ff');
tx('улучшай оружие и продержись как можно дольше.',W/2,H/2+32,16,'#cfd3ff');
tx('Рекорд: '+tm(best),W/2,H/2+72,18,'#ffe66b');tx('Нажми, чтобы начать',W/2,H/2+112,22,'#4dffb0')}
if(mode==='lvl'){shade(.75);tx('Новый уровень — выбери улучшение',W/2,H/2-150,18,'#4dffb0');
S.cho.forEach(function(id,i){var c=card(i);x.fillStyle='#232852';x.strokeStyle='#4dffb0';x.lineWidth=2;x.beginPath();x.rect(c.x,c.y,c.w,c.h);x.fill();x.stroke();
tx(UP[id][0],c.x+16,c.y+32,20,'#fff','left');tx(UP[id][1],c.x+16,c.y+58,14,'#aab0e8','left')})}
if(mode==='dead'){shade(.78);tx('Рой победил',W/2,H/2-80,40,'#ff5a7a');
tx('Время: '+tm(S.t)+'   Убито: '+S.kills+'   Ур. '+S.lv,W/2,H/2-30,18);
tx(newBest?'Новый рекорд!':'Рекорд: '+tm(best),W/2,H/2+6,18,'#ffe66b');
tx('Нажми, чтобы сыграть снова',W/2,H/2+60,22,'#4dffb0')}
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();
if(mode==='menu'){init();return}
if(mode==='dead'){if(performance.now()>lock)init();return}
if(mode==='lvl'){for(var i=0;i<3;i++){var c=card(i);if(e.offsetX>=c.x&&e.offsetX<=c.x+c.w&&e.offsetY>=c.y&&e.offsetY<=c.y+c.h){UP[S.cho[i]][2]();mode='play';return}}return}
joy={id:e.pointerId,x:e.offsetX,y:e.offsetY,dx:0,dy:0};try{cv.setPointerCapture(e.pointerId)}catch(err){}});
cv.addEventListener('pointermove',function(e){if(!joy||joy.id!==e.pointerId)return;var dx=(e.offsetX-joy.x)/50,dy=(e.offsetY-joy.y)/50,m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}joy.dx=dx;joy.dy=dy});
function end(e){if(joy&&joy.id===e.pointerId)joy=null}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
addEventListener('keydown',function(e){keys[e.code]=1});addEventListener('keyup',function(e){keys[e.code]=0});
init();mode='menu';
var last=0;
function loop(t){var dt=Math.min((t-last)/1000||0,.05);last=t;if(mode==='play')up(dt);else S.ang+=dt;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
