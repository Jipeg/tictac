<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Крестики-нолики</title>
<style>
:root{--bg:#eef3f0;--ink:#23265f;--x:#23265f;--o:#d98f00;--line:#23265f;--cell:#e1e9e4;--win:#c9d8cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14172e;--ink:#e8ebff;--x:#9aa4ff;--o:#ffbf3c;--line:#9aa4ff;--cell:#1d2142;--win:#2c3263}}
:root[data-theme="dark"]{--bg:#14172e;--ink:#e8ebff;--x:#9aa4ff;--o:#ffbf3c;--line:#9aa4ff;--cell:#1d2142;--win:#2c3263}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
main{max-width:420px;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:18px}
h1{font-size:30px;margin:0;font-weight:700;letter-spacing:.01em}
.modes{display:flex;gap:8px}
.modes button{flex:1;padding:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:15px;border-radius:10px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.score{display:flex;justify-content:space-between;font-size:17px}
.score b{font-size:22px}
#status{font-size:20px;min-height:28px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;aspect-ratio:1;background:var(--line);padding:8px;border-radius:14px}
.cell{background:var(--cell);border:0;border-radius:8px;font:700 min(22vw,92px)/1 Georgia,serif;cursor:pointer;color:var(--ink);padding:0}
.cell.x{color:var(--x)}.cell.o{color:var(--o)}
.cell.win{background:var(--win)}
.cell:focus-visible,.modes button:focus-visible,#again:focus-visible{outline:3px solid var(--o);outline-offset:2px}
#again{padding:14px;font:inherit;font-size:18px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Крестики-нолики</h1>
<div class="modes">
<button id="mAI" aria-pressed="true">Против компьютера</button>
<button id="m2" aria-pressed="false">Вдвоём</button>
</div>
<div class="score"><span>Крестики: <b id="sx">0</b></span><span>Ничьи: <b id="sd">0</b></span><span>Нолики: <b id="so">0</b></span></div>
<div id="status" aria-live="polite"></div>
<div class="board" id="board"></div>
<button id="again">Новая партия</button>
</main>
<script>
var L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var b,turn,over,vsAI=true,sc={X:0,O:0,D:0};
var boardEl=document.getElementById('board'),st=document.getElementById('status'),cells=[];
for(var i=0;i<9;i++){var c=document.createElement('button');c.className='cell';c.setAttribute('aria-label','Клетка '+(i+1));(function(i){c.onclick=function(){play(i)}})(i);boardEl.appendChild(c);cells.push(c)}
function winner(s){for(var k=0;k<8;k++){var l=L[k];if(s[l[0]]&&s[l[0]]===s[l[1]]&&s[l[0]]===s[l[2]])return{p:s[l[0]],l:l}}return null}
function render(){for(var i=0;i<9;i++){cells[i].textContent=b[i]==='X'?'✕':b[i]==='O'?'◯':'';cells[i].className='cell'+(b[i]?' '+b[i].toLowerCase():'');}}
function reset(){b=Array(9).fill('');turn='X';over=false;render();msg()}
function msg(){st.textContent=vsAI?(turn==='X'?'Ваш ход':'Компьютер думает…'):'Ходит '+(turn==='X'?'крестик':'нолик')}
function end(){var w=winner(b);if(w){over=true;sc[w.p]++;w.l.forEach(function(i){cells[i].classList.add('win')});st.textContent=(w.p==='X'?'Выиграли крестики':'Выиграли нолики')+'!'}else if(b.every(Boolean)){over=true;sc.D++;st.textContent='Ничья'}
if(over){document.getElementById('sx').textContent=sc.X;document.getElementById('so').textContent=sc.O;document.getElementById('sd').textContent=sc.D}return over}
function play(i){if(over||b[i]||(vsAI&&turn==='O'))return;b[i]=turn;render();if(end())return;turn=turn==='X'?'O':'X';msg();if(vsAI&&turn==='O')setTimeout(ai,450)}
function mm(s,p){var w=winner(s);if(w)return w.p==='O'?1:-1;if(s.every(Boolean))return 0;var best=p==='O'?-2:2;for(var i=0;i<9;i++)if(!s[i]){s[i]=p;var v=mm(s,p==='O'?'X':'O');s[i]='';if(p==='O'?v>best:v<best)best=v}return best}
function ai(){if(over)return;var free=[],i;for(i=0;i<9;i++)if(!b[i])free.push(i);var m;
if(Math.random()<0.2){m=free[Math.floor(Math.random()*free.length)]}else{var bs=-2;free.forEach(function(i){b[i]='O';var v=mm(b,'X');b[i]='';if(v>bs){bs=v;m=i}})}
b[m]='O';render();if(end())return;turn='X';msg()}
function setMode(a){vsAI=a;document.getElementById('mAI').setAttribute('aria-pressed',a);document.getElementById('m2').setAttribute('aria-pressed',!a);reset()}
document.getElementById('mAI').onclick=function(){setMode(true)};
document.getElementById('m2').onclick=function(){setMode(false)};
document.getElementById('again').onclick=reset;
reset();
</script>
</body>
</html>
